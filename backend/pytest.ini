[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q

# Silence a warning raised by FastAPI/Starlette's TestClient itself
# ("Using `httpx` with `starlette.testclient` is deprecated; install `httpx2`
# instead") — it originates from the third-party test client's import, not our
# code, and is pending an upstream fix. Scoped by the distinctive message text
# so genuine warnings in our own code still surface.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
