# Render.com blueprint — Docker web service (free tier works).
# NOTE: the free instance filesystem is ephemeral — the SQLite demo database is
# reset on redeploy/restart, which is fine for a portfolio demo. For persistence,
# attach a managed PostgreSQL and set DATABASE_URL accordingly.
services:
  - type: web
    name: agentops
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SIMULATION_ENABLED
        value: "true"
      - key: SIMULATION_AUTOSTART
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true          # Render generates a strong secret at first deploy
      - key: SHOW_DEMO_CREDS
        value: "false"
      - key: LLM_ENABLED
        value: "false"
      - key: RANDOM_SEED
        value: "none"
      - key: FEATURE_FLAGS
        value: predictive_health=false
      # - key: LLM_ENABLED
      #   value: "true"
      # - key: ANTHROPIC_API_KEY
      #   sync: false
